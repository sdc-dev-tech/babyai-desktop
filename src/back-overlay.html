<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  #btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(20, 20, 20, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: background 0.15s;
  }
  #btn:hover {
    background: rgba(20, 20, 20, 0.9);
  }
  #btn:active {
    background: rgba(0, 0, 0, 0.95);
  }
</style>
</head>
<body>
  <div id="btn" title="Back">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M10 3L5 8l5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      window.backOverlay.goBack();
    });
  </script>
</body>
</html>
